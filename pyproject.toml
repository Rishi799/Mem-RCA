[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memrca"
version = "0.1.0"
description = "Open-world root cause analysis for microservices via propagation-aware incident memory"
requires-python = ">=3.11"
# torch is installed separately (CUDA build): see README
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.3",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "huggingface_hub",
]

[tool.setuptools.packages.find]
where = ["src"]
