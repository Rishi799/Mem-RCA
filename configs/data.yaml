# Data settings for Mem-RCA.
raw_dir: data/raw
processed_dir: data/processed

# RCAEval suite used for the main open-world experiments.
suite: re2
systems: [ob, ss, tt]          # Online Boutique, Sock Shop, Train Ticket

fault_types: [cpu, mem, disk, delay, loss, socket]

# Open-world folds: held-out fault types never appear in training.
folds:
  fold1: {known: [cpu, mem, delay, loss],      unseen: [disk, socket]}
  fold2: {known: [mem, disk, delay, socket],   unseen: [cpu, loss]}
  fold3: {known: [cpu, disk, loss, socket],    unseen: [mem, delay]}

# Case-level split by repetition. Use the same root-cause/fault combinations
# across different repetitions only in their assigned split; never split windows
# from one case across train, validation, and test.
train_repetitions: [1]
validation_repetitions: [2]
test_repetitions: [3]

# For each fold, unseen fault types are excluded from both train and validation
# and appear only in the test split. Tune anomaly and unknown-fault thresholds
# using validation cases only.

# Window length (in timesteps) is chosen after checking the sampling interval
# with scripts/explore_case.py.
window_length: null
